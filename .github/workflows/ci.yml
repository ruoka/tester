name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Only cancel superseded PR runs. Never cancel main mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        config: [debug, release]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Verify std.cppm location
        run: |
          if [ -f /usr/lib/llvm-21/share/libc++/v1/std.cppm ]; then
            echo "std.cppm found at /usr/lib/llvm-21/share/libc++/v1/std.cppm"
          else
            echo "Warning: std.cppm not found at expected location"
            find /usr/lib/llvm-21 -name "std.cppm" 2>/dev/null || echo "std.cppm not found anywhere"
          fi

      - name: Show compiler version
        run: clang++ --version

      - name: Build project (${{ matrix.config }})
        run: ./tools/CB.sh ${{ matrix.config }} build

      - name: Build tests (${{ matrix.config }})
        run: ./tools/CB.sh ${{ matrix.config }} build --build-tests

      # Consumers run with --jobs=nproc; tester must prove both sequential and parallel
      # runner modes stay green (default remains jobs=1 unless --jobs= is set).
      - name: Run self tests sequential (${{ matrix.config }})
        run: |
          set -euo pipefail
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures --jobs=1 \
            --junit="test_results_self_seq_${{ matrix.config }}.xml" \
            --tags='\[self\]' > "test_results_self_seq_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_self_seq_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Self tests (jobs=1) failed (summary.passed=$passed)"
            tail -20 "test_results_self_seq_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Self tests passed (jobs=1)"

      - name: Run self tests parallel (${{ matrix.config }})
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          echo "Running [self] tests with --jobs=${jobs}"
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures --jobs="${jobs}" \
            --junit="test_results_self_par_${{ matrix.config }}.xml" \
            --tags='\[self\]' > "test_results_self_par_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_self_par_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Self tests (jobs=${jobs}) failed (summary.passed=$passed)"
            tail -20 "test_results_self_par_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Self tests passed (jobs=${jobs})"

      # The whole suite, not only the [self] subset. tools/CB.sh sets
      # CB_INCLUDE_EXAMPLES_MODE=always, so this covers examples/ too: their failure demos
      # carry hidden [.demo] tags, which is why an unfiltered run is expected to pass.
      - name: Run standalone suite sequential (${{ matrix.config }})
        run: |
          set -euo pipefail
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures --jobs=1 \
            --junit="test_results_seq_${{ matrix.config }}.xml" \
            > "test_results_seq_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_seq_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Standalone suite (jobs=1) failed (summary.passed=$passed)"
            tail -20 "test_results_seq_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Standalone suite passed (jobs=1)"

      - name: Run standalone suite parallel (${{ matrix.config }})
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          echo "Running standalone suite with --jobs=${jobs}"
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures --jobs="${jobs}" \
            --junit="test_results_par_${{ matrix.config }}.xml" \
            > "test_results_par_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_par_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Standalone suite (jobs=${jobs}) failed (summary.passed=$passed)"
            tail -20 "test_results_par_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Standalone suite passed (jobs=${jobs})"

      # The demos exist to show what a failure looks like, so a passing run means they
      # stopped demonstrating anything. Non-zero exit is the expected outcome, which is
      # why the command is the `if` condition instead of being followed by `|| true`.
      - name: Run failure demos (must fail)
        if: matrix.config == 'debug'
        run: |
          if ./tools/CB.sh debug test --jsonl=failures \
            --junit=test_results_demos.xml \
            --tags='\[.demo\]' > test_results_demos.jsonl; then
            echo "Failure demos exited 0; they are supposed to fail"
            exit 1
          fi
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' test_results_demos.jsonl)
          if [ "$passed" != "false" ]; then
            echo "Failure demos reported summary.passed=$passed"
            exit 1
          fi
          echo "✓ Failure demos still fail as designed"

      - name: Validate JSONL output
        run: |
          set -euo pipefail
          for f in \
            "test_results_self_seq_${{ matrix.config }}.jsonl" \
            "test_results_self_par_${{ matrix.config }}.jsonl" \
            "test_results_seq_${{ matrix.config }}.jsonl" \
            "test_results_par_${{ matrix.config }}.jsonl"; do
            echo "JSONL lines ($f): $(wc -l < "$f")"
            if ! tail -1 "$f" | jq -e '.type == "eof"' >/dev/null; then
              echo "✗ EOF marker missing in $f — the stream was truncated"
              tail -5 "$f"
              exit 1
            fi
          done
          echo "✓ EOF marker found in sequential and parallel JSONL streams"

      # Structural jq checks above cannot catch a line that is unparseable, or one
      # missing a field agents depend on. This validates every line of the canonical
      # commands against docs/jsonl-schema.json, including a probe that deliberately
      # emits non-UTF-8 assertion data.
      - name: Validate JSONL against schema
        if: matrix.config == 'debug'
        run: |
          python3 -m pip install --quiet jsonschema
          ./tests/jsonl/validate.py --require-schema --jsonl | tee jsonl_validate.jsonl
          grep '"type":"jsonl_validate_summary"' jsonl_validate.jsonl | tail -1 | grep -q '"passed":true'

      # Gate suites only — demos are expected to fail and would muddy the job summary.
      # Default show=fail leaves only a tiny SVG badge when everything passes (easy to
      # miss, and the image host can fail to load). show=all writes the test table into
      # the job Summary on green runs too.
      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          show: all
          paths: |
            test_results_self_seq_${{ matrix.config }}.xml
            test_results_self_par_${{ matrix.config }}.xml
            test_results_seq_${{ matrix.config }}.xml
            test_results_par_${{ matrix.config }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.config }}
          path: |
            test_results_seq_${{ matrix.config }}.jsonl
            test_results_par_${{ matrix.config }}.jsonl
            test_results_self_seq_${{ matrix.config }}.jsonl
            test_results_self_par_${{ matrix.config }}.jsonl
            test_results_demos.jsonl
            test_results_seq_${{ matrix.config }}.xml
            test_results_par_${{ matrix.config }}.xml
            test_results_self_seq_${{ matrix.config }}.xml
            test_results_self_par_${{ matrix.config }}.xml
            test_results_demos.xml

  # Second build path: clang-scan-deps + Makefile into build-make-<os>-<config>/.
  # Matrix config spelling matches CB and CMake (debug|release): release is the Make
  # default, debug is DEBUG=1. Gates the same [self] contract the release policy
  # requires, and fails the job if the full rebuild emits any compiler warning
  # (make has no object cache, so every unit is compiled).
  makefile-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        config: [debug, release]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Show make toolchain
        run: |
          make --version | head -1
          clang++-21 --version | head -1
          clang-scan-deps-21 --version | head -1

      # DEBUG=1 selects build-make-<os>-debug/ and -O0; omit it for release (-O3).
      - name: Make args (${{ matrix.config }})
        run: |
          set -euo pipefail
          if [ '${{ matrix.config }}' = debug ]; then
            echo "MAKE_DEBUG=DEBUG=1" >> "$GITHUB_ENV"
          else
            echo "MAKE_DEBUG=" >> "$GITHUB_ENV"
          fi

      - name: Make DEBUG pie flags (Linux-only)
        if: matrix.config == 'debug'
        run: ./tests/make/debug_flags.sh

      - name: Build with make (${{ matrix.config }}, warning-free)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          make ${MAKE_DEBUG} tests 2>&1 | tee "make_build_${{ matrix.config }}.log"
          if grep -E '(^|[[:space:]])warning:' "make_build_${{ matrix.config }}.log"; then
            echo "✗ make ${{ matrix.config }} build produced compiler warnings"
            exit 1
          fi
          echo "✓ make tests (${{ matrix.config }}) built warning-free"

      - name: Run self tests sequential (${{ matrix.config }})
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/test_results_make_self_seq_${{ matrix.config }}"
          # shellcheck disable=SC2086
          make ${MAKE_DEBUG} run_tests \
            TEST_TAGS="--jsonl=failures --jobs=1 --junit=${out}.xml --tags=[self]" \
            > "${out}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "${out}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Makefile ${{ matrix.config }} self tests (jobs=1) failed (summary.passed=$passed)"
            tail -20 "${out}.jsonl"
            exit 1
          fi
          echo "✓ Makefile ${{ matrix.config }} self tests passed (jobs=1)"

      - name: Run self tests parallel (${{ matrix.config }})
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          out="${GITHUB_WORKSPACE}/test_results_make_self_par_${{ matrix.config }}"
          echo "Running make ${{ matrix.config }} [self] tests with --jobs=${jobs}"
          # shellcheck disable=SC2086
          make ${MAKE_DEBUG} run_tests \
            TEST_TAGS="--jsonl=failures --jobs=${jobs} --junit=${out}.xml --tags=[self]" \
            > "${out}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "${out}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Makefile ${{ matrix.config }} self tests (jobs=${jobs}) failed (summary.passed=$passed)"
            tail -20 "${out}.jsonl"
            exit 1
          fi
          echo "✓ Makefile ${{ matrix.config }} self tests passed (jobs=${jobs})"

      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          show: all
          paths: |
            test_results_make_self_seq_${{ matrix.config }}.xml
            test_results_make_self_par_${{ matrix.config }}.xml

      - name: Upload Makefile test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-makefile-${{ matrix.config }}
          path: |
            make_build_${{ matrix.config }}.log
            test_results_make_self_seq_${{ matrix.config }}.jsonl
            test_results_make_self_par_${{ matrix.config }}.jsonl
            test_results_make_self_seq_${{ matrix.config }}.xml
            test_results_make_self_par_${{ matrix.config }}.xml

  # Third build path: CMakeLists.txt driving CMake's own module scanner and Ninja.
  # It gates the same [self] contract as the other two, so wiring only this build
  # depends on — the CXX_MODULES file sets and the import-std setup — cannot rot
  # unnoticed. Warning-free is a gate here for the same reason it is under make:
  # a cold CI tree compiles every unit, so nothing hides behind an object cache.
  cmake-ninja-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # Same spelling as build-and-test / makefile-build-and-test (debug|release).
        # CMAKE_BUILD_TYPE still wants Debug/Release — mapped at configure time.
        config: [debug, release]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      # Pinned CMake 4.x + Ninja; the devcontainer installs the same pin so both
      # environments build this path with one CMake.
      - name: Setup CMake + Ninja (shared)
        uses: ./.github/actions/setup-cmake

      - name: Show CMake toolchain
        run: |
          cmake --version | head -1
          ninja --version
          clang++-21 --version | head -1

      # build-cmake-<os>-<config>/ — same lowercase config token as CB and Make.
      - name: Configure (${{ matrix.config }})
        run: |
          set -euo pipefail
          cfg='${{ matrix.config }}'
          case "$cfg" in
            debug) cmake_type=Debug ;;
            release) cmake_type=Release ;;
            *) echo "unknown matrix.config=$cfg" >&2; exit 1 ;;
          esac
          echo "CMAKE_BUILD_DIR=build-cmake-linux-${cfg}" >> "$GITHUB_ENV"
          cmake -S . -B "build-cmake-linux-${cfg}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${cmake_type}"

      - name: Build (${{ matrix.config }}, warning-free)
        run: |
          set -euo pipefail
          cmake --build "${CMAKE_BUILD_DIR}" 2>&1 | tee "cmake_build_${{ matrix.config }}.log"
          if grep -E '(^|[[:space:]])warning:' "cmake_build_${{ matrix.config }}.log"; then
            echo "✗ CMake build produced compiler warnings"
            exit 1
          fi
          echo "✓ CMake + Ninja build is warning-free"

      # TEST_RUNNER is what the custom targets set: the self tests re-spawn the
      # runner and otherwise look for <cwd>/build-*/bin/test_runner, which a CMake
      # tree does not have (runner sits at the build-dir root).
      - name: Run self tests sequential (${{ matrix.config }})
        working-directory: ${{ env.CMAKE_BUILD_DIR }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/test_results_cmake_self_seq_${{ matrix.config }}"
          TEST_RUNNER="${PWD}/test_runner" ./test_runner --jsonl=failures --jobs=1 \
            --junit="${out}.xml" --tags='\[self\]' > "${out}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "${out}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "CMake self tests (jobs=1) failed (summary.passed=$passed)"
            tail -20 "${out}.jsonl"
            exit 1
          fi
          echo "✓ CMake self tests passed (jobs=1)"

      - name: Run self tests parallel (${{ matrix.config }})
        working-directory: ${{ env.CMAKE_BUILD_DIR }}
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          out="${GITHUB_WORKSPACE}/test_results_cmake_self_par_${{ matrix.config }}"
          TEST_RUNNER="${PWD}/test_runner" ./test_runner --jsonl=failures --jobs="${jobs}" \
            --junit="${out}.xml" --tags='\[self\]' > "${out}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "${out}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "CMake self tests (jobs=${jobs}) failed (summary.passed=$passed)"
            tail -20 "${out}.jsonl"
            exit 1
          fi
          echo "✓ CMake self tests passed (jobs=${jobs})"

      # The CMake runner links examples/ in unconditionally, so this covers them too;
      # their failure demos carry hidden [.demo] tags and stay out of an unfiltered run.
      - name: Run standalone suite (${{ matrix.config }})
        working-directory: ${{ env.CMAKE_BUILD_DIR }}
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          out="${GITHUB_WORKSPACE}/test_results_cmake_all_${{ matrix.config }}"
          TEST_RUNNER="${PWD}/test_runner" ./test_runner --jsonl=failures --jobs="${jobs}" \
            --junit="${out}.xml" > "${out}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "${out}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "CMake standalone suite failed (summary.passed=$passed)"
            tail -20 "${out}.jsonl"
            exit 1
          fi
          echo "✓ CMake standalone suite passed (jobs=${jobs})"

      # The entry point CMakeLists.txt documents for developers. Ninja prints its own
      # progress lines on the same stdout as the JSONL, so the summary is picked out
      # instead of the whole stream being parsed.
      - name: Run run_tests convenience target
        if: matrix.config == 'debug'
        run: |
          set -euo pipefail
          cmake --build "${CMAKE_BUILD_DIR}" --target run_tests > cmake_run_tests.log
          summary=$(grep '"type":"summary"' cmake_run_tests.log | tail -1 || true)
          if ! printf '%s' "$summary" | jq -e '.passed == true' > /dev/null; then
            echo "✗ run_tests target reported a failure"
            echo "$summary"
            exit 1
          fi
          echo "✓ run_tests target passes"

      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          show: all
          paths: |
            test_results_cmake_self_seq_${{ matrix.config }}.xml
            test_results_cmake_self_par_${{ matrix.config }}.xml
            test_results_cmake_all_${{ matrix.config }}.xml

      - name: Upload CMake test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-cmake-${{ matrix.config }}
          path: |
            cmake_build_${{ matrix.config }}.log
            test_results_cmake_self_seq_${{ matrix.config }}.jsonl
            test_results_cmake_self_par_${{ matrix.config }}.jsonl
            test_results_cmake_all_${{ matrix.config }}.jsonl
            test_results_cmake_self_seq_${{ matrix.config }}.xml
            test_results_cmake_self_par_${{ matrix.config }}.xml
            test_results_cmake_all_${{ matrix.config }}.xml

  cb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Build CB (debug)
        run: ./tools/CB.sh debug build

      - name: Run CB smoke tests
        run: |
          set -euo pipefail
          ./tests/cb/smoke.sh --jsonl | tee cb_smoke.jsonl
          grep '"type":"smoke_end"' cb_smoke.jsonl | tail -1 | grep -q '"passed":true'

      - name: Upload CB smoke results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cb-smoke-results
          path: cb_smoke.jsonl

  mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Build CB (debug)
        run: ./tools/CB.sh debug build

      - name: Run MCP CB bridge smoke tests
        run: |
          set -euo pipefail
          ./tests/mcp/smoke.sh --jsonl | tee mcp_smoke.jsonl
          grep '"type":"smoke_end"' mcp_smoke.jsonl | tail -1 | grep -q '"passed":true'

      - name: Upload MCP smoke results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mcp-smoke-results
          path: mcp_smoke.jsonl

  # Advisory by decision, not by accident. Neither tool is given the module graph — a
  # module interface analysed without -fmodule-file reports diagnostics no fix can remove —
  # so their output is collected for reading rather than used as a gate. The findings are
  # uploaded; making either one gate requires a curated check set first.
  static-analysis:
    name: static-analysis (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM + analysis tools
        uses: ./.github/actions/setup-llvm
        with:
          packages: "libc++-21-dev libc++abi-21-dev clang-21 lld-21 lldb-21 jq clang-tools-21 clang-tidy-21 cppcheck"

      - name: Run clang-tidy on core files (advisory)
        run: |
          find tester -name "*.c++m" | head -10 | xargs -I {} sh -c '
            echo "Analyzing {}"
            clang-tidy-21 {} -- -std=c++23 -I/usr/lib/llvm-21/include/c++/v1 2>&1 || true
          ' | tee -a static-analysis.log

      - name: Run cppcheck (advisory)
        run: |
          cppcheck --enable=all --std=c++23 --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --quiet \
            tester/ tools/ 2>&1 | tee -a static-analysis.log || true

      - name: Upload static analysis output
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-analysis
          path: static-analysis.log

  submodule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check submodule status
        run: |
          echo "=== Submodule Status ==="
          git submodule status || echo "No submodules"
          echo ""
          echo "=== Checking for uncommitted changes ==="
          if git status --porcelain | grep -q .; then
            echo "✗ Uncommitted changes found in main repo"
            git status --porcelain
            exit 1
          else
            echo "✓ Main repo is clean"
          fi

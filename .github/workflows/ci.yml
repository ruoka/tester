name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Only cancel superseded PR runs. Never cancel main mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        config: [debug, release]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Verify std.cppm location
        run: |
          if [ -f /usr/lib/llvm-21/share/libc++/v1/std.cppm ]; then
            echo "std.cppm found at /usr/lib/llvm-21/share/libc++/v1/std.cppm"
          else
            echo "Warning: std.cppm not found at expected location"
            find /usr/lib/llvm-21 -name "std.cppm" 2>/dev/null || echo "std.cppm not found anywhere"
          fi

      - name: Show compiler version
        run: clang++ --version

      - name: Build project (${{ matrix.config }})
        run: ./tools/CB.sh ${{ matrix.config }} build

      - name: Build tests (${{ matrix.config }})
        run: ./tools/CB.sh ${{ matrix.config }} build --build-tests

      - name: Run self tests (${{ matrix.config }})
        run: |
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures \
            --junit="test_results_self_${{ matrix.config }}.xml" \
            --tags='\[self\]' > "test_results_self_${{ matrix.config }}.jsonl"
          if command -v jq >/dev/null 2>&1; then
            passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_self_${{ matrix.config }}.jsonl")
            if [ "$passed" != "true" ]; then
              echo "Self tests failed (summary.passed=$passed)"
              tail -20 "test_results_self_${{ matrix.config }}.jsonl"
              exit 1
            fi
            echo "✓ Self tests passed"
          fi

      # The whole suite, not only the [self] subset. tools/CB.sh sets
      # CB_INCLUDE_EXAMPLES_MODE=always, so this covers examples/ too: their failure demos
      # carry hidden [.demo] tags, which is why an unfiltered run is expected to pass.
      - name: Run standalone suite (${{ matrix.config }})
        run: |
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures \
            --junit="test_results_${{ matrix.config }}.xml" \
            > "test_results_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Standalone suite failed (summary.passed=$passed)"
            tail -20 "test_results_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Standalone suite passed"

      # The demos exist to show what a failure looks like, so a passing run means they
      # stopped demonstrating anything. Non-zero exit is the expected outcome, which is
      # why the command is the `if` condition instead of being followed by `|| true`.
      - name: Run failure demos (must fail)
        if: matrix.config == 'debug'
        run: |
          if ./tools/CB.sh debug test --jsonl=failures \
            --junit=test_results_demos.xml \
            --tags='\[.demo\]' > test_results_demos.jsonl; then
            echo "Failure demos exited 0; they are supposed to fail"
            exit 1
          fi
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' test_results_demos.jsonl)
          if [ "$passed" != "false" ]; then
            echo "Failure demos reported summary.passed=$passed"
            exit 1
          fi
          echo "✓ Failure demos still fail as designed"

      - name: Validate JSONL output
        run: |
          echo "JSONL lines: $(wc -l < "test_results_${{ matrix.config }}.jsonl")"
          if ! tail -1 "test_results_${{ matrix.config }}.jsonl" | jq -e '.type == "eof"' >/dev/null; then
            echo "✗ EOF marker missing — the stream was truncated"
            tail -5 "test_results_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ EOF marker found"

      # Structural jq checks above cannot catch a line that is unparseable, or one
      # missing a field agents depend on. This validates every line of the canonical
      # commands against docs/jsonl-schema.json, including a probe that deliberately
      # emits non-UTF-8 assertion data.
      - name: Validate JSONL against schema
        if: matrix.config == 'debug'
        run: |
          python3 -m pip install --quiet jsonschema
          ./tests/jsonl/validate.py --require-schema --jsonl | tee jsonl_validate.jsonl
          grep '"type":"jsonl_validate_summary"' jsonl_validate.jsonl | tail -1 | grep -q '"passed":true'

      # Gate suites only — demos are expected to fail and would muddy the job summary.
      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: |
            test_results_self_${{ matrix.config }}.xml
            test_results_${{ matrix.config }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.config }}
          path: |
            test_results_${{ matrix.config }}.jsonl
            test_results_self_${{ matrix.config }}.jsonl
            test_results_demos.jsonl
            test_results_${{ matrix.config }}.xml
            test_results_self_${{ matrix.config }}.xml
            test_results_demos.xml

  cb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Build CB (debug)
        run: ./tools/CB.sh debug build

      - name: Run CB smoke tests
        run: |
          set -euo pipefail
          ./tests/cb/smoke.sh --jsonl | tee cb_smoke.jsonl
          grep '"type":"smoke_end"' cb_smoke.jsonl | tail -1 | grep -q '"passed":true'

      - name: Upload CB smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cb-smoke-results
          path: cb_smoke.jsonl

  mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Build CB (debug)
        run: ./tools/CB.sh debug build

      - name: Run MCP CB bridge smoke tests
        run: |
          set -euo pipefail
          ./tests/mcp/smoke.sh --jsonl | tee mcp_smoke.jsonl
          grep '"type":"smoke_end"' mcp_smoke.jsonl | tail -1 | grep -q '"passed":true'

      - name: Upload MCP smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-smoke-results
          path: mcp_smoke.jsonl

  # Advisory by decision, not by accident. Neither tool is given the module graph — a
  # module interface analysed without -fmodule-file reports diagnostics no fix can remove —
  # so their output is collected for reading rather than used as a gate. The findings are
  # uploaded; making either one gate requires a curated check set first.
  static-analysis:
    name: static-analysis (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM + analysis tools
        uses: ./.github/actions/setup-llvm
        with:
          packages: "libc++-21-dev libc++abi-21-dev clang-21 lld-21 lldb-21 jq clang-tools-21 clang-tidy-21 cppcheck"

      - name: Run clang-tidy on core files (advisory)
        run: |
          find tester -name "*.c++m" | head -10 | xargs -I {} sh -c '
            echo "Analyzing {}"
            clang-tidy-21 {} -- -std=c++23 -I/usr/lib/llvm-21/include/c++/v1 2>&1 || true
          ' | tee -a static-analysis.log

      - name: Run cppcheck (advisory)
        run: |
          cppcheck --enable=all --std=c++23 --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --quiet \
            tester/ tools/ 2>&1 | tee -a static-analysis.log || true

      - name: Upload static analysis output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis
          path: static-analysis.log

  submodule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check submodule status
        run: |
          echo "=== Submodule Status ==="
          git submodule status || echo "No submodules"
          echo ""
          echo "=== Checking for uncommitted changes ==="
          if git status --porcelain | grep -q .; then
            echo "✗ Uncommitted changes found in main repo"
            git status --porcelain
            exit 1
          else
            echo "✓ Main repo is clean"
          fi
